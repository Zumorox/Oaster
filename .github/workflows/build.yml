name: Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  android:
    name: Android (phone, tablet, TV)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Build release APK and AAB
        run: ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease --no-daemon --stacktrace

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            androidApp/build/outputs/apk/**/*.apk
            androidApp/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

  windows-desktop:
    name: Windows desktop (portable)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build portable desktop distribution
        run: .\gradlew.bat :desktopApp:createDistributable --no-daemon --stacktrace

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: |
            desktopApp/build/compose/binaries/main/app/**
          if-no-files-found: warn
